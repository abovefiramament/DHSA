screscomp-cecm-scan-attention-heads = "screscomp.cli.cecm_scan_attention_heads:main"
screscomp-cecm-run-fixed-actuator-generation = "screscomp.cli.cecm_run_fixed_actuator_generation:main"
screscomp-cecm-train-attention-head-actuator = "screscomp.cli.cecm_train_attention_head_actuator:main"
