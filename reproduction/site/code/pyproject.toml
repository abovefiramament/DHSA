[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screscomp"
version = "0.1.0"
description = "Source-conditioned residual competition toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "transformers>=4.41,<5",
  "peft>=0.13",
  "numpy>=1.26,<2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
screscomp-build = "screscomp.cli.build_dataset:main"
screscomp-probe = "screscomp.cli.run_prior_probe:main"
screscomp-split = "screscomp.cli.make_splits:main"
screscomp-render = "screscomp.cli.render_prompts:main"
screscomp-audit = "screscomp.cli.audit_prompts:main"
screscomp-score-behavior = "screscomp.cli.score_behavior:main"
screscomp-score-residual-patching = "screscomp.cli.score_residual_patching:main"
screscomp-score-pairwise-patching = "screscomp.cli.score_pairwise_patching:main"
screscomp-score-direction-intervention = "screscomp.cli.score_direction_intervention:main"
screscomp-score-interaction-matrix = "screscomp.cli.score_interaction_matrix:main"
screscomp-score-component-competition = "screscomp.cli.score_component_competition:main"
screscomp-score-steering-utility = "screscomp.cli.score_steering_utility:main"
screscomp-prepare-ckplug-ab = "screscomp.cli.prepare_ckplug_ab:main"
screscomp-prepare-ckplug-open = "screscomp.cli.prepare_ckplug_open:main"
screscomp-score-external-steering-utility = "screscomp.cli.score_external_steering_utility:main"
screscomp-score-ckplug-generation = "screscomp.cli.score_ckplug_generation:main"
screscomp-score-ckplug-prediction = "screscomp.cli.score_ckplug_prediction:main"
screscomp-score-ckplug-official = "screscomp.cli.score_ckplug_official:main"
screscomp-summarize-ckplug-generations = "screscomp.cli.summarize_ckplug_generations:main"
screscomp-select-ckplug-alpha = "screscomp.cli.select_ckplug_alpha:main"
screscomp-rescore-ckplug-generation = "screscomp.cli.rescore_ckplug_generation:main"
screscomp-analyze-ckplug-arbitration = "screscomp.cli.analyze_ckplug_arbitration:main"
